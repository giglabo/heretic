name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun test

  bundle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run bundle
      - name: Verify bundle runs
        run: bun dist/heretic-cli.js --version
      - name: Verify npm pack
        run: npm pack --dry-run

  # Native binaries for every release target, cross-compiled from Linux, so a
  # PR that breaks `bun build --compile` (e.g. a missing text asset) fails here
  # and not at release time. Artifacts are kept for a week for manual testing.
  binaries:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    strategy:
      matrix:
        include:
          - target: bun-linux-x64
            artifact: heretic-cli-linux-x64
          - target: bun-linux-arm64
            artifact: heretic-cli-linux-arm64
          - target: bun-darwin-x64
            artifact: heretic-cli-macos-x64
          - target: bun-darwin-arm64
            artifact: heretic-cli-macos-arm64
          - target: bun-windows-x64
            artifact: heretic-cli-windows.exe
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun build ./src/index.ts --compile --target=${{ matrix.target }} --outfile dist/${{ matrix.artifact }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: cli/dist/${{ matrix.artifact }}
          retention-days: 7

  # The compiled binary starts on each OS and the embedded assets are intact.
  smoke:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cli
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun build ./src/index.ts --compile --outfile dist/heretic-cli
      - run: ./dist/heretic-cli --version
      - run: ./dist/heretic-cli ssh presets
      - name: Embedded ssh-exec matches the source asset
        run: diff -B <(./dist/heretic-cli image generate --format ssh-exec) src/templates/assets/ssh-exec

  # SSH backend against a real sshd on the runner, then from a real container
  # that reaches the runner through host-gateway (the docker-host topology).
  ssh-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun build ./src/index.ts --compile --outfile dist/heretic-cli
      - name: Install sshd
        run: sudo apt-get update -q && sudo apt-get install -y -q openssh-server
      - name: Lint shell assets
        run: shellcheck -S warning src/templates/assets/ssh-exec tests/e2e/ssh-e2e.sh
      - name: SSH e2e (host + CLI + container)
        run: sudo env E2E_CONTAINER=1 E2E_LISTEN=0.0.0.0 HERETIC_CLI="$PWD/dist/heretic-cli" bash tests/e2e/ssh-e2e.sh
      - name: Start sshd for the runner user
        run: |
          sudo ssh-keygen -A
          printf '%s\n' 'Port 2222' 'ListenAddress 0.0.0.0' 'UsePAM yes' \
            'PasswordAuthentication no' 'KbdInteractiveAuthentication no' \
            'HostKey /etc/ssh/ssh_host_ed25519_key' 'HostKey /etc/ssh/ssh_host_ecdsa_key' \
            'HostKey /etc/ssh/ssh_host_rsa_key' 'PidFile /tmp/sshd-2222.pid' > /tmp/sshd-2222.conf
          sudo mkdir -p /run/sshd && sudo /usr/sbin/sshd -f /tmp/sshd-2222.conf
      - name: Docker-host test as a regular user (Linux container → this runner)
        run: ../scripts/test-ssh-docker-host.sh --cli "$PWD/dist/heretic-cli" --port 2222

  # The macOS side of "Linux container → Mac host": hosted macOS runners have no
  # Docker (no nested virtualization), so this drives the host side natively —
  # macOS sshd, zsh login shell, BSD userland, a real Mach-O from `cc` and its
  # auto-run routing. The container half is the same code as ssh-e2e; the full
  # pairing runs locally with scripts/test-ssh-docker-host.sh on a Mac.
  ssh-macos-host:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun build ./src/index.ts --compile --outfile dist/heretic-cli
      - name: Start sshd for the runner user
        run: |
          sudo ssh-keygen -A
          printf '%s\n' 'Port 2222' 'ListenAddress 127.0.0.1' 'UsePAM yes' \
            'PasswordAuthentication no' 'KbdInteractiveAuthentication no' \
            'HostKey /etc/ssh/ssh_host_ed25519_key' 'HostKey /etc/ssh/ssh_host_ecdsa_key' \
            'HostKey /etc/ssh/ssh_host_rsa_key' 'PidFile /tmp/sshd-2222.pid' 'LogLevel DEBUG1' > /tmp/sshd-2222.conf
          sudo /usr/sbin/sshd -f /tmp/sshd-2222.conf -E /tmp/sshd-2222.log
      - name: Docker-host test, host side (macOS)
        run: ../scripts/test-ssh-docker-host.sh --cli "$PWD/dist/heretic-cli" --port 2222 --no-container
      - name: sshd diagnostics
        if: failure()
        run: |
          ls -ld ~ ~/.ssh ~/.ssh/authorized_keys || true
          dscl . -read /Groups/com.apple.access_ssh 2>&1 | head -5 || true
          id
          sudo grep -vE 'debug1: (channel|session|server_input)' /tmp/sshd-2222.log | tail -60

  # The full "Linux container → Mac host" pairing: Intel macOS runners support
  # nested virtualization, so colima runs Linux containers there (Apple Silicon
  # hosted runners cannot). The container reaches the Mac via host-gateway.
  ssh-docker-host-macos:
    runs-on: macos-15-intel
    timeout-minutes: 45
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun build ./src/index.ts --compile --outfile dist/heretic-cli
      - name: Docker via colima
        run: |
          brew install colima docker
          colima start --cpu 2 --memory 4
      - name: Start sshd for the runner user
        run: |
          sudo ssh-keygen -A
          printf '%s\n' 'Port 2222' 'ListenAddress 0.0.0.0' 'UsePAM yes' \
            'PasswordAuthentication no' 'KbdInteractiveAuthentication no' \
            'HostKey /etc/ssh/ssh_host_ed25519_key' 'HostKey /etc/ssh/ssh_host_ecdsa_key' \
            'HostKey /etc/ssh/ssh_host_rsa_key' 'PidFile /tmp/sshd-2222.pid' > /tmp/sshd-2222.conf
          sudo /usr/sbin/sshd -f /tmp/sshd-2222.conf -E /tmp/sshd-2222.log
      - name: Linux container → this Mac (full docker-host test)
        run: ../scripts/test-ssh-docker-host.sh --cli "$PWD/dist/heretic-cli" --port 2222
      - name: sshd log
        if: failure()
        run: sudo tail -60 /tmp/sshd-2222.log

  exec-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli/build-sidecars/exec-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/build-sidecars/exec-server/go.mod
      - run: go vet ./...
      - run: CGO_ENABLED=0 go build -trimpath -o /dev/null .
