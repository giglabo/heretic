# Claude Fat Cat - Docker Compose Configuration
#
# Usage:
#   docker compose up -d                    # Start agent
#   docker compose -f docker-compose.yml -f docker-compose.sidecars.yml up -d  # With sidecars
#   docker attach claude-fat-cat            # Attach to running agent
#   docker exec -it claude-fat-cat /bin/bash  # Exec into running agent

version: "3.8"

services:
  # ============================================================================
  # Main Agent Service
  # ============================================================================
  claude:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Base image: node:22-bookworm-slim (slim) or ubuntu:22.04 (full)
        BASE_IMAGE: ${BASE_IMAGE:-node:22-bookworm-slim}
        # Tool installation flags
        INSTALL_PYTHON: ${INSTALL_PYTHON:-false}
        INSTALL_NODE: ${INSTALL_NODE:-false}
        INSTALL_GO: ${INSTALL_GO:-false}
        INSTALL_JAVA: ${INSTALL_JAVA:-false}
        INSTALL_RUST: ${INSTALL_RUST:-false}
        INSTALL_DOCKER: ${INSTALL_DOCKER:-false}
        INSTALL_GH_CLI: ${INSTALL_GH_CLI:-true}
    image: ${IMAGE_NAME:-claude-fat-cat}:${IMAGE_TAG:-latest}
    container_name: claude-fat-cat
    stdin_open: true
    tty: true
    environment:
      # Anthropic/Z.AI API Configuration
      - ANTHROPIC_AUTH_TOKEN=${ANTHROPIC_AUTH_TOKEN}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      - API_TIMEOUT_MS=${API_TIMEOUT_MS:-3000000}
      
      # Git Configuration
      - GH_TOKEN=${GH_TOKEN}
      - GIT_AUTHOR_NAME=${GIT_AUTHOR_NAME:-Claude Agent}
      - GIT_AUTHOR_EMAIL=${GIT_AUTHOR_EMAIL:-agent@cloud-agents.io}
      
      # Workflow Configuration (used by orchestrator)
      - TASK_ID=${TASK_ID}
      - STEP_NAME=${STEP_NAME}
      - REPO_PATH=/workspace
      - PROMPT_FILE=${PROMPT_FILE}
      - AGENT_ARGS=${AGENT_ARGS}
      - AGENT_OUTPUT_FORMAT=${AGENT_OUTPUT_FORMAT:-stream-json}
      
      # Sidecar Configuration (JSON format)
      # Example: {"python":{"internal_url":"http://python-sidecar:8080"}}
      - BUILD_SIDECARS=${BUILD_SIDECARS}
      - SIDECAR_TIMEOUT=${SIDECAR_TIMEOUT:-600}

      # SSH Backend Configuration
      - SSH_HOST=${SSH_HOST:-}
      - SSH_PORT=${SSH_PORT:-22}
      - SSH_USER=${SSH_USER:-agent}
      - SSH_KEY_PATH=${SSH_KEY_PATH:-/home/agent/.ssh/id_rsa}
      - SSH_HOST_CWD=${SSH_HOST_CWD:-}
    volumes:
      # Workspace mount
      - ${WORKSPACE_PATH:-./workspace}:/workspace
      
      # Claude settings (optional)
      - ${CLAUDE_SETTINGS_PATH:-./settings.json}:/home/agent/.claude/settings.json:ro
      
      # MCP configuration (optional)
      - ${MCP_CONFIG_PATH:-./mcp.json}:/workspace/.mcp.json:ro

      # SSH key (optional, for SSH backend)
      - ${SSH_KEY_FILE:-/dev/null}:/home/agent/.ssh/id_rsa:ro
    working_dir: /workspace
    command: /bin/bash
    networks:
      - claude-network

  # ============================================================================
  # Optional: Build Sidecars
  # Uncomment and use with --profile sidecars
  # ============================================================================
  
  # python-sidecar:
  #   image: builder-python:latest
  #   container_name: python-sidecar
  #   profiles: ["sidecars"]
  #   volumes:
  #     - ${WORKSPACE_PATH:-./workspace}:/workspace
  #   networks:
  #     - claude-network
  #   environment:
  #     - SIDECAR_RUNTIME=python
  #
  # node-sidecar:
  #   image: builder-node:latest
  #   container_name: node-sidecar
  #   profiles: ["sidecars"]
  #   volumes:
  #     - ${WORKSPACE_PATH:-./workspace}:/workspace
  #   networks:
  #     - claude-network
  #   environment:
  #     - SIDECAR_RUNTIME=node
  #
  # go-sidecar:
  #   image: builder-go:latest
  #   container_name: go-sidecar
  #   profiles: ["sidecars"]
  #   volumes:
  #     - ${WORKSPACE_PATH:-./workspace}:/workspace
  #   networks:
  #     - claude-network
  #   environment:
  #     - SIDECAR_RUNTIME=go

  # ============================================================================
  # Optional: Local MCP Server
  # Uncomment and use with --profile mcp
  # ============================================================================
  
  # mcp-server:
  #   image: mcp-server:latest
  #   container_name: mcp-local
  #   profiles: ["mcp"]
  #   ports:
  #     - "8080:8080"
  #   networks:
  #     - claude-network

networks:
  claude-network:
    driver: bridge
